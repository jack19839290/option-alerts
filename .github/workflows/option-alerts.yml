name: Option alerts refresh

on:
  workflow_dispatch:
  schedule:
    # 0.4.0 過渡期安全網：Apps Script 成功啟動兩次後移除此 schedule 區塊。
    - cron: '2 * * * *'

permissions:
  contents: read

concurrency:
  group: option-alerts-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      MAX_MONITOR_ROWS: '1000'

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Authenticate to Google Sheets
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh option alerts
        run: python -m app.run_once
