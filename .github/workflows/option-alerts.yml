name: Option alerts refresh

on:
  workflow_dispatch:
    inputs:
      force:
        description: Allow a manual refresh outside market hours
        required: false
        default: false
        type: boolean
      operation:
        description: Job to run
        required: false
        default: refresh
        type: choice
        options:
          - refresh
          - expiration_lookup
      ticker:
        description: Ticker used by expiration_lookup
        required: false
        default: ''
        type: string
      request_id:
        description: Request id used by expiration_lookup
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: option-alerts-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      MAX_MONITOR_ROWS: '1000'
      FORCE_REFRESH: ${{ github.event.inputs.force || 'false' }}
      EXPIRATION_TICKER: ${{ github.event.inputs.ticker || '' }}
      EXPIRATION_REQUEST_ID: ${{ github.event.inputs.request_id || '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Authenticate to Google Sheets
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh option alerts
        if: ${{ github.event.inputs.operation != 'expiration_lookup' }}
        run: python -m app.run_once

      - name: Lookup option expirations
        if: ${{ github.event.inputs.operation == 'expiration_lookup' }}
        run: python -m app.lookup_expirations
